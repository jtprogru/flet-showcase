[project]
name = "flet-showcase"
version = "2.0.0"
description = "Витрина компонентов Flet: 13 разделов интерактивных контролов, графиков и анимаций"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["flet", "gui", "showcase", "material", "cupertino", "charts"]
dependencies = [
    "flet==0.86.5",
    "flet-charts==0.86.5",
]

[dependency-groups]
dev = ["flet-cli==0.86.5", "flet-desktop==0.86.5", "flet-web==0.86.5"]
test = ["pytest==9.1.1", "pytest-cov==7.1.0"]
lint = ["ruff==0.16.6", "mypy==2.3.1"]

[tool.flet]
org = "dev.jtprogru"
company = "jtprogru"
product = "Витрина Flet"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "."
module = "main"

# Шаблон flet 0.86.5 закрепляет jni 1.0.0, а jni_flutter 1.0.4 (вышел 2026-10-01)
# сгенерирован под jni ^1.1.0, хотя в pubspec по-прежнему просит ^1.0.0. Pub
# выбирает 1.0.4, и сборка падает на JniVersionCheck. Держим последнюю
# совместимую версию, пока flet не обновит шаблон.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.mypy.overrides]]
module = ["flet_charts.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app", "main"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]

# В терминале skip_covered экономит место, но в HTML он прячет вообще всё,
# пока покрытие 100% — там нужен полный список файлов.
[tool.coverage.html]
skip_covered = false
