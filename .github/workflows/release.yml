# Сборка витрины под Linux, Windows и macOS и публикация в GitHub Releases.
#
# - тег vX.Y.Z: все платформы, результат уходит в релиз этого тега;
# - ручной запуск: выбранные платформы, с publish=true докладываются в релиз тега;
# - PR с правками этого файла или скриптов установки: всё собирается без публикации.
#
# Windows ARM64 отдельно не собирается: flet 0.86.5 умеет забирать результат
# только из x64-каталога Flutter, а Windows 11 на ARM запускает x64-сборку
# через эмуляцию. Linux собирается на 22.04, чтобы бинарник работал на glibc 2.35+.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/install.sh
      - scripts/install.ps1
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег, например v2.1.0. Пусто: собрать выбранную ветку без релиза"
        required: false
        default: ""
      targets:
        description: "all или через запятую: linux-x64, linux-arm64, windows-x64, macos-arm64, macos-x64"
        required: false
        default: all
      publish:
        description: "Выложить сборки в релиз тега"
        type: boolean
        default: false
      prerelease:
        description: "Пометить новый релиз как pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      tag: ${{ steps.ref.outputs.tag }}
      publish: ${{ steps.ref.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve ref
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push) tag="$REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) tag="" ;;
          esac
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег должен выглядеть как vX.Y.Z, получено: $tag"
            exit 1
          fi
          publish=false
          if [[ "$EVENT" == push ]]; then
            publish=true
          elif [[ "$EVENT" == workflow_dispatch && "$INPUT_PUBLISH" == true ]]; then
            if [[ -z "$tag" ]]; then
              echo "::error::Для publish=true нужен tag: без него непонятно, в какой релиз выкладывать"
              exit 1
            fi
            publish=true
          fi
          {
            echo "tag=$tag"
            echo "ref=${tag:-$SHA}"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Plan
        id: plan
        env:
          TAG: ${{ steps.ref.outputs.tag }}
          TARGETS: ${{ inputs.targets || 'all' }}
        shell: python3 {0}
        run: |
          import json
          import os
          import sys
          import tomllib

          def target(runner, flet_target, ext, extra_args=""):
              return {
                  "runner": runner,
                  "target": flet_target,
                  "extra_args": extra_args,
                  "ext": ext,
              }

          TARGETS = {
              "linux-x64": target("ubuntu-22.04", "linux", "tar.gz"),
              "linux-arm64": target("ubuntu-22.04-arm", "linux", "tar.gz"),
              "windows-x64": target("windows-2025", "windows", "zip"),
              "macos-arm64": target("macos-15", "macos", "zip", "--arch arm64"),
              "macos-x64": target("macos-15-intel", "macos", "zip", "--arch x64"),
          }

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          tag = os.environ["TAG"]
          if tag and tag.removeprefix("v") != version:
              print(f"::error::Тег {tag} не совпадает с версией {version} в pyproject.toml")
              sys.exit(1)

          requested = os.environ["TARGETS"].strip()
          if requested == "all":
              names = list(TARGETS)
          else:
              names = [n.strip() for n in requested.split(",") if n.strip()]
          unknown = [n for n in names if n not in TARGETS]
          if unknown or not names:
              print(
                  f"::error::Неизвестные платформы: {', '.join(unknown) or 'пусто'}. "
                  f"Доступны: {', '.join(TARGETS)}"
              )
              sys.exit(1)

          matrix = [{"name": name, **TARGETS[name]} for name in names]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"matrix={json.dumps(matrix)}\n")
          print(f"Версия {version}, платформы: {', '.join(names)}")

  check:
    name: check
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: make check

  build:
    name: build (${{ matrix.name }})
    needs: [plan, check]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Build
        id: build
        uses: flet-dev/flet-build-action@96093619265697f7c68cef5cf18981e4be296b11 # v1.0.0
        with:
          target: ${{ matrix.target }}
          build-version: ${{ needs.plan.outputs.version }}
          build-number: ${{ github.run_number }}
          # Имя каталога становится корнем архива на Linux и Windows.
          output-directory: build/dist/flet-showcase
          extra-args: ${{ matrix.extra_args }}

      - name: Rename archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.build.outputs.archive-path }}
          ASSET: flet-showcase-${{ matrix.name }}.${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # На Windows путь приходит с обратными слэшами, Git Bash понимает прямые.
          mv "${ARCHIVE//\\//}" "dist/$ASSET"
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/flet-showcase-${{ matrix.name }}.${{ matrix.ext }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.plan.outputs.tag || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: flet-showcase-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum flet-showcase-* > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Publish
        if: needs.plan.outputs.publish == 'true'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Релиз уже есть (например, создан вместе с тегом): докладываем файлы
            # и сохраняем контрольные суммы платформ, которые сейчас не пересобирались.
            if gh release download "$TAG" --pattern SHA256SUMS.txt --output old.txt 2> /dev/null; then
              awk 'NR == FNR { fresh[$2]; next } !($2 in fresh)' SHA256SUMS.txt old.txt > kept.txt
              cat kept.txt >> SHA256SUMS.txt
              sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
              rm -f old.txt kept.txt
            fi
          else
            args=(--verify-tag --title "$TAG" --generate-notes)
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" flet-showcase-* SHA256SUMS.txt --clobber
          gh release view "$TAG" --json url --jq .url
